<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Throwaway Routempo v1 prototype aligned with the current product UI."
    />
    <title>Routempo workflow prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ink: {
                DEFAULT: "var(--ink-900)",
                900: "var(--ink-900)",
                800: "var(--ink-800)",
                700: "var(--ink-700)",
                500: "var(--ink-500)",
                400: "var(--ink-400)",
              },
              mist: "var(--paper-50)",
              paper: {
                0: "var(--paper-0)",
                50: "var(--paper-50)",
                100: "var(--paper-100)",
                200: "var(--paper-200)",
                300: "var(--paper-300)",
                400: "var(--paper-400)",
              },
              signal: {
                50: "var(--signal-50)",
                100: "var(--signal-100)",
                200: "var(--signal-200)",
                300: "var(--signal-300)",
                500: "var(--signal-500)",
                600: "var(--signal-600)",
                700: "var(--signal-700)",
                800: "var(--signal-800)",
                900: "var(--signal-900)",
              },
              completed: {
                100: "var(--completed-100)",
                500: "var(--completed-500)",
                600: "var(--completed-600)",
              },
              missed: {
                100: "var(--missed-100)",
                500: "var(--missed-500)",
                600: "var(--missed-600)",
                700: "var(--missed-700)",
              },
              skipped: {
                100: "var(--skipped-100)",
                500: "var(--skipped-500)",
                600: "var(--skipped-600)",
                700: "var(--skipped-700)",
              },
              action: {
                DEFAULT: "var(--interactive)",
                hover: "var(--interactive-hover)",
              },
              inverse: "var(--surface-inverse)",
              "on-inverse": "var(--text-inverse)",
              "auth-panel": "var(--auth-panel)",
            },
            boxShadow: {
              soft: "var(--shadow-md)",
              float: "var(--shadow-pop)",
            },
            fontFamily: {
              sans: ["Manrope", "system-ui", "sans-serif"],
              display: ["Manrope", "system-ui", "sans-serif"],
              mono: ["DM Mono", "ui-monospace", "monospace"],
            },
            fontSize: {
              "2xs": ["0.6875rem", { lineHeight: "1.4" }],
              xs: ["0.75rem", { lineHeight: "1.5" }],
              sm: ["0.8125rem", { lineHeight: "1.5" }],
              base: ["0.9375rem", { lineHeight: "1.5" }],
              lg: ["1.0625rem", { lineHeight: "1.45" }],
              xl: ["1.375rem", { lineHeight: "1.28" }],
              "2xl": ["1.625rem", { lineHeight: "1.22" }],
              "3xl": ["1.875rem", { lineHeight: "1.15" }],
              "4xl": ["2.25rem", { lineHeight: "1.1" }],
              "5xl": ["2.75rem", { lineHeight: "1.05" }],
            },
          },
        },
      }
    </script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --paper-0: #ffffff;
        --paper-50: #f8faf9;
        --paper-100: #f1f5f2;
        --paper-200: #e2e8e4;
        --paper-300: #cbd5ce;
        --paper-400: #94a39a;
        --ink-900: #17201a;
        --ink-800: #27352c;
        --ink-700: #405047;
        --ink-500: #647269;
        --ink-400: #87938b;
        --signal-50: #f0fdf4;
        --signal-100: #dcfce7;
        --signal-200: #bbf7d0;
        --signal-300: #86efac;
        --signal-400: #4ade80;
        --signal-500: #22c55e;
        --signal-600: #15803d;
        --signal-700: #166534;
        --signal-800: #14532d;
        --signal-900: #0f3d24;
        --completed-100: #e4f4ec;
        --completed-500: #25b36b;
        --completed-600: #1f9d5b;
        --missed-100: #fbe7e8;
        --missed-500: #e5484d;
        --missed-600: #d83a3f;
        --missed-700: #b9272d;
        --skipped-100: #fbf0dd;
        --skipped-500: #e8a13a;
        --skipped-600: #cf8a26;
        --skipped-700: #a96b18;
        --surface-inverse: #14532d;
        --text-inverse: #ffffff;
        --auth-panel: #14532d;
        --interactive: #15803d;
        --interactive-hover: #166534;
        --shadow-md:
          0 4px 10px -2px rgb(23 32 26 / 0.08),
          0 2px 4px -2px rgb(23 32 26 / 0.05);
        --shadow-pop: 0 18px 44px -10px rgb(23 32 26 / 0.2);
      }
      .dark {
        color-scheme: dark;
        --paper-0: #171d18;
        --paper-50: #101511;
        --paper-100: #202821;
        --paper-200: #2b352d;
        --paper-300: #3a463d;
        --paper-400: #647067;
        --ink-900: #f2f6f2;
        --ink-800: #e2e9e3;
        --ink-700: #cad4cc;
        --ink-500: #a7b7aa;
        --ink-400: #839187;
        --signal-50: #26382b;
        --signal-100: #294333;
        --signal-200: #345b3e;
        --signal-300: #72c58c;
        --signal-400: #4ade80;
        --signal-500: #4fae6b;
        --signal-600: #72c58c;
        --signal-700: #a8d8b5;
        --signal-800: #c6ead0;
        --signal-900: #e5f6ea;
        --completed-100: #173528;
        --completed-500: #38bd79;
        --completed-600: #55ce8d;
        --missed-100: #421f24;
        --missed-500: #ef6468;
        --missed-600: #ff7b7f;
        --missed-700: #ff989b;
        --skipped-100: #3b2d18;
        --skipped-500: #e9aa50;
        --skipped-600: #f1ba69;
        --skipped-700: #f6ca87;
        --surface-inverse: #dfeee2;
        --text-inverse: #17261c;
        --auth-panel: #10251a;
        --interactive: #15803d;
        --interactive-hover: #166534;
        --shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.3);
        --shadow-pop: 0 18px 44px -10px rgb(0 0 0 / 0.56);
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: "Manrope", system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        text-rendering: optimizeLegibility;
      }
      h1,
      h2,
      h3,
      .font-display {
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 600;
      }
      h1 {
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
      h2,
      h3 {
        line-height: 1.25;
        letter-spacing: -0.015em;
      }
      .font-bold {
        font-weight: 600 !important;
      }
      button.font-bold,
      button.font-semibold {
        font-weight: 500 !important;
      }
      button,
      a,
      input,
      select {
        outline: none;
        font-family: inherit;
      }
      button {
        font-weight: 500;
      }
      button,
      a {
        transition-duration: 140ms;
        transition-timing-function: cubic-bezier(0.2, 0, 0, 1);
      }
      input,
      select {
        color: var(--ink-900);
      }
      ::selection {
        background: var(--signal-100);
        color: var(--ink-900);
      }
      [class*="rounded-xl"] {
        border-radius: 10px !important;
      }
      [class*="rounded-2xl"] {
        border-radius: 14px !important;
      }
      [class*="rounded-lg"] {
        border-radius: 6px !important;
      }
      .tabular-nums,
      [data-measure] {
        font-family: "DM Mono", ui-monospace, monospace;
        font-variant-numeric: tabular-nums;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        box-shadow: 0 0 0 3px rgb(21 128 61 / 0.24);
      }
      .view-enter {
        animation: view-enter 0.24s ease-out;
      }
      .toast-enter {
        animation: toast-enter 0.28s ease-out;
      }
      @keyframes view-enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes toast-enter {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body class="bg-mist text-ink min-h-[100dvh] font-sans antialiased">
    <!--
      PROTOTYPE ONLY. No persistence and no production integration.
      Question: Does the current Routempo workflow feel clear from a first login?
    -->
    <div id="app"></div>

    <script>
      const prototypeParams = new URLSearchParams(location.search)
      if (prototypeParams.has("variant")) {
        const cleanUrl = new URL(location.href)
        cleanUrl.searchParams.delete("variant")
        history.replaceState({}, "", cleanUrl)
      }

      const state = {
        theme: window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light",
        categories: [],
        routines: [],
        logs: [],
        toast: null,
        modal:
          prototypeParams.get("dialog") === "add"
            ? {
                type: "add",
                startDate: prototypeParams.get("date") || "2026-08-10",
              }
            : null,
        menuOpen: false,
        planView: "week",
        selectedDay: 0,
        insightRange: "7",
        logFilter: "all",
        expandedLog: null,
        settings: {
          name: "Montasim",
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC",
          reminder: "10",
          notifications: false,
          weeklySummary: false,
        },
      }

      function currentPage() {
        const value = new URLSearchParams(location.search)
          .get("page")
          ?.toLowerCase()
        return [
          "login",
          "today",
          "plan",
          "insights",
          "logs",
          "settings",
        ].includes(value)
          ? value
          : "today"
      }

      function todayRoutines() {
        return state.routines.filter((routine) =>
          routineOccursOnDate(routine, "2026-08-10", 0)
        )
      }

      function pendingRoutines() {
        return todayRoutines().filter((routine) => routine.status === "pending")
      }

      function completedCount() {
        return todayRoutines().filter(
          (routine) => routine.status === "completed"
        ).length
      }

      function routineOccursOnDate(routine, date, dayIndex) {
        const startDate = routine.startDate || "2026-08-10"
        const repeat = routine.repeat || "Every day"
        if (date < startDate || (routine.endDate && date > routine.endDate))
          return false
        if (repeat === "Does not repeat") return date === startDate
        if (repeat === "Weekdays") return dayIndex < 5
        if (repeat === "Once a week") {
          const elapsedDays = Math.round(
            (new Date(`${date}T00:00:00`) - new Date(`${startDate}T00:00:00`)) /
              86400000
          )
          return elapsedDays % 7 === 0
        }
        return true
      }

      function scheduleLabel(routine) {
        const repeat = routine.repeat || "Every day"
        if (repeat !== "Does not repeat") return repeat
        return new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
        }).format(new Date(`${routine.startDate}T00:00:00`))
      }

      function greeting() {
        const hour = Number(
          new Intl.DateTimeFormat("en-US", {
            timeZone: state.settings.timezone,
            hour: "numeric",
            hourCycle: "h23",
          }).format(new Date())
        )
        const period =
          hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening"
        return `Good ${period}, ${state.settings.name}`
      }

      function icon(name, className = "h-5 w-5") {
        return `<i data-lucide="${name}" class="${className}" aria-hidden="true"></i>`
      }

      function render() {
        document.documentElement.classList.toggle(
          "dark",
          state.theme === "dark"
        )
        document.getElementById("app").innerHTML = `
          <main class="min-h-[100dvh]">
            ${currentPage() === "login" ? renderLogin() : renderGuidedHome()}
          </main>
          ${renderModal()}
          ${renderToast()}
        `
        lucide.createIcons({ attrs: { "stroke-width": 1.8 } })
      }

      function brand(compact = false) {
        return `
          <a href="?page=today" class="inline-flex items-center gap-2.5 rounded-xl" aria-label="Routempo home">
            <img src="../../../apps/web/public/logo.svg" alt="" class="h-8 w-8" />
            ${compact ? "" : `<span class="font-display text-[18px] font-bold tracking-[-0.02em]">Rou<span class="text-signal-600 dark:text-signal-300">tempo</span></span>`}
          </a>
        `
      }

      function renderLogin() {
        return `
          <div class="view-enter min-h-[100dvh] bg-paper-50 px-4 py-4 dark:bg-paper-50 sm:px-6 sm:py-6">
            <div class="mx-auto grid min-h-[calc(100dvh-2rem)] max-w-[1180px] overflow-hidden rounded-2xl border border-paper-200 bg-paper-0 shadow-soft dark:border-paper-200 dark:bg-paper-0 sm:min-h-[calc(100dvh-3rem)] lg:grid-cols-[minmax(0,1.05fr)_minmax(420px,.95fr)]">
              <section class="relative hidden overflow-hidden bg-auth-panel p-10 text-white lg:flex lg:flex-col lg:justify-between xl:p-14">
                <div class="flex items-center gap-2.5">
                  <img src="../../../apps/web/public/logo.svg" alt="" class="h-9 w-9 rounded-xl bg-white p-1.5" />
                  <span class="font-display text-lg font-semibold">Routempo</span>
                </div>
                <div class="max-w-xl py-14">
                  <p class="font-mono text-xs font-medium uppercase tracking-[0.12em] text-white/65">A calmer daily rhythm</p>
                  <h1 class="mt-5 max-w-lg text-4xl font-semibold tracking-[-0.03em] text-white xl:text-5xl">Know what comes next. Record what actually happened.</h1>
                  <p class="mt-5 max-w-md text-base leading-7 text-white/70">Routempo keeps your schedule, reminders, and progress in one place without turning your day into another dashboard to manage.</p>
                </div>
                <div class="grid grid-cols-3 gap-3 border-t border-white/15 pt-6 text-sm text-white/70">
                  <div><span class="block font-mono text-lg font-medium text-white">01</span><span class="mt-1 block">Plan simply</span></div>
                  <div><span class="block font-mono text-lg font-medium text-white">02</span><span class="mt-1 block">Act on time</span></div>
                  <div><span class="block font-mono text-lg font-medium text-white">03</span><span class="mt-1 block">Learn gently</span></div>
                </div>
              </section>

              <section class="relative flex min-h-[620px] flex-col px-5 py-6 sm:px-10 sm:py-9 lg:px-14 xl:px-20">
                <div class="flex items-center justify-between">
                  <div class="lg:hidden">${brand()}</div>
                  <div class="ml-auto">${themeButton()}</div>
                </div>
                <div class="my-auto w-full max-w-[420px] self-center py-10">
                  <div class="grid h-11 w-11 place-items-center rounded-xl bg-signal-50 text-signal-600 dark:bg-signal-50 dark:text-signal-300">${icon("shield-check", "h-5 w-5")}</div>
                  <p class="mt-6 text-sm font-medium text-signal-600 dark:text-signal-300">Welcome to Routempo</p>
                  <h1 class="mt-3 text-[1.6rem] font-semibold tracking-[-0.02em]">Sign in to continue</h1>
                  <p class="mt-3 text-sm leading-6 text-ink-500 dark:text-ink-400">Use your Google account to securely access today’s routines, plan, and progress.</p>
                  <button onclick="signInWithGoogle()" class="mt-8 inline-flex h-12 w-full items-center justify-center gap-3 rounded-xl border border-paper-300 bg-paper-0 px-5 text-sm font-medium text-ink-800 shadow-sm hover:bg-paper-50 active:scale-[.99] dark:border-paper-300 dark:bg-paper-100 dark:text-ink-700 dark:hover:bg-paper-200">${icon("chrome", "h-[18px] w-[18px]")} Continue with Google</button>
                  <div class="mt-6 flex items-start gap-3 rounded-xl bg-paper-50 p-4 dark:bg-paper-100">
                    ${icon("lock-keyhole", "mt-0.5 h-4 w-4 shrink-0 text-signal-600 dark:text-signal-300")}
                    <p class="text-xs leading-5 text-ink-500 dark:text-ink-400">Routempo uses Google only to verify your identity. The prototype does not send or store account data.</p>
                  </div>
                </div>
                <p class="text-center text-xs leading-5 text-ink-400">By continuing, you agree to the prototype terms and privacy notice.</p>
              </section>
            </div>
          </div>
        `
      }

      function themeButton() {
        const nextLabel =
          state.theme === "dark" ? "Use light theme" : "Use dark theme"
        return `
          <button onclick="toggleTheme()" class="grid h-10 w-10 place-items-center rounded-xl border border-black/10 bg-paper-0 text-ink-700 transition hover:bg-paper-50 active:scale-[.97] dark:border-paper-200 dark:bg-paper-0 dark:text-ink-400 dark:hover:bg-paper-100" aria-label="${nextLabel}" title="${nextLabel}">
            ${icon(state.theme === "dark" ? "sun" : "moon", "h-[18px] w-[18px]")}
          </button>
        `
      }

      function avatarButton() {
        return `
          <button onclick="toggleMenu()" class="grid h-10 w-10 place-items-center overflow-hidden rounded-full bg-signal-100 text-sm font-bold text-signal-700 transition active:scale-[.97] dark:bg-signal-50 dark:text-signal-300" aria-label="Open account menu" aria-expanded="${state.menuOpen}"><span aria-hidden="true">M</span></button>
        `
      }

      function accountMenu(position = "right-0 top-12") {
        if (!state.menuOpen) return ""
        return `
          <div class="absolute ${position} z-30 w-60 rounded-2xl border border-black/10 bg-paper-0 p-2 shadow-soft dark:border-paper-200 dark:bg-paper-100">
            <div class="px-3 py-2">
              <p class="text-sm font-semibold">${state.settings.name}</p>
              <p class="mt-0.5 truncate text-xs text-ink-500 dark:text-ink-400">montasim@example.com</p>
            </div>
            <div class="my-1 h-px bg-black/5 dark:bg-paper-100"></div>
            <button onclick="navigatePage('settings')" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm hover:bg-paper-100 dark:hover:bg-paper-100">${icon("settings", "h-4 w-4")} Settings</button>
            <button onclick="openConfirmation('signout')" class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm hover:bg-paper-100 dark:hover:bg-paper-100">${icon("log-out", "h-4 w-4")} Sign out</button>
          </div>
        `
      }

      function desktopSidebar() {
        const routinesToday = todayRoutines()
        return `
          <aside class="sticky top-0 hidden h-[100dvh] w-[255.2px] shrink-0 border-r border-paper-200 bg-paper-0 px-4 py-6 lg:flex lg:flex-col">
            <div class="px-2">${brand()}</div>
            <nav class="mt-9 space-y-1" aria-label="Primary navigation">
              ${sideNavItem("home", "Today", "today")}
              ${sideNavItem("calendar-days", "Plan", "plan")}
              ${sideNavItem("chart-no-axes-column-increasing", "Insights", "insights")}
              ${sideNavItem("scroll-text", "Logs", "logs")}
              ${sideNavItem("settings", "Settings", "settings")}
            </nav>
            <div class="mt-auto px-3">
              <p class="text-xs font-semibold text-ink-400 dark:text-ink-500">Today</p>
              ${
                routinesToday.length
                  ? `<div class="mt-3 flex gap-1.5" aria-label="${completedCount()} of ${routinesToday.length} routines completed">${routinesToday.map((routine) => `<span class="h-1.5 flex-1 rounded-full ${routine.status === "completed" ? "bg-completed-500" : routine.status === "skipped" ? "bg-skipped-500" : "bg-paper-200"}"></span>`).join("")}</div><p data-measure class="mt-2 text-xs text-ink-500">${completedCount()} of ${routinesToday.length} complete</p>`
                  : `<p class="mt-2 text-xs text-ink-500">No routines scheduled</p>`
              }
            </div>
          </aside>
        `
      }

      function renderGuidedHome() {
        if (currentPage() !== "today")
          return renderSecondaryPage("sidebar", currentPage())
        const routinesToday = todayRoutines()
        const next = pendingRoutines()[0]
        const upcoming = pendingRoutines().slice(1)
        return `
          <div class="view-enter min-h-[100dvh] bg-paper-50 dark:bg-paper-50">
            <div class="flex min-h-[100dvh] w-full">
              ${desktopSidebar()}

              <section class="min-w-0 flex-1">
                <header class="sticky top-0 z-20 flex min-h-[72px] flex-wrap items-center justify-between gap-y-2 border-b border-paper-200 bg-paper-0/95 px-4 py-3 backdrop-blur md:px-8">
                  <div class="flex items-center gap-3 lg:hidden">${brand()} </div>
                  <p class="hidden text-sm font-medium text-ink-500 lg:block dark:text-ink-400">Monday, August 10</p>
                  <div class="relative flex items-center gap-2">${themeButton()} ${avatarButton()} ${accountMenu()}</div>
                  <nav class="flex w-full gap-1 lg:hidden" aria-label="Primary navigation">${compactNav()}</nav>
                </header>

                <div class="w-full px-4 py-8 md:px-8">
                  <div class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
                    <div>
                      <p class="text-sm font-semibold text-ink-500">${greeting()}</p>
                      <h1 class="mt-2 text-[1.6rem] font-bold tracking-[-0.02em] md:text-[1.9125rem]">${state.routines.length ? "Here is what needs your attention." : "Build a rhythm that fits your day."}</h1>
                    </div>
                    <button onclick="openAddRoutine()" class="inline-flex h-11 shrink-0 items-center justify-center gap-2 self-start rounded-xl bg-action px-4 text-sm font-semibold text-white transition hover:bg-action-hover active:scale-[.97] sm:self-auto">
                      ${icon("plus", "h-4 w-4")} Add routine
                    </button>
                  </div>

                  ${
                    !state.routines.length
                      ? renderEmptyState(
                          "calendar-days",
                          "Start with one routine",
                          "Choose one useful thing and give it a realistic time. You can add more after the first one feels right.",
                          "Add your first routine",
                          "openAddRoutine()"
                        )
                      : next
                        ? `
                    <section class="mt-8 overflow-hidden rounded-2xl bg-inverse text-on-inverse shadow-soft">
                      <div class="grid gap-7 p-6 md:grid-cols-[1fr_auto] md:items-end md:p-8">
                        <div>
