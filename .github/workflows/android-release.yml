name: Android GitHub Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/^VERSION_NAME=//p' apps/mobile/version.properties)"
          expected_tag="android-v${version_name}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Expected tag ${expected_tag}, received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "name=${version_name}" >> "${GITHUB_OUTPUT}"

      - name: Decode signing keystore
        shell: bash
        env:
          ROUTEMPO_KEYSTORE_BASE64: ${{ secrets.ROUTEMPO_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ROUTEMPO_KEYSTORE_BASE64}" ]]; then
            echo "ROUTEMPO_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          printf '%s' "${ROUTEMPO_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/routempo-release.jks"

      - name: Verify Android project
        working-directory: apps/mobile
        run: bash ./gradlew testDebugUnitTest lintRelease --no-configuration-cache

      - name: Build signed release APK
        working-directory: apps/mobile
        env:
          ROUTEMPO_SIGNING_STORE_FILE: ${{ runner.temp }}/routempo-release.jks
          ROUTEMPO_SIGNING_STORE_PASSWORD: ${{ secrets.ROUTEMPO_SIGNING_STORE_PASSWORD }}
          ROUTEMPO_SIGNING_KEY_ALIAS: ${{ secrets.ROUTEMPO_SIGNING_KEY_ALIAS }}
          ROUTEMPO_SIGNING_KEY_PASSWORD: ${{ secrets.ROUTEMPO_SIGNING_KEY_PASSWORD }}
        run: bash ./gradlew packageGithubRelease --no-configuration-cache

      - name: Verify signature and create checksum
        id: asset
        shell: bash
        run: |
          asset_dir="apps/mobile/app/build/outputs/github-release"
          asset_name="Routempo-android-v${{ steps.version.outputs.name }}.apk"
          apk="${asset_dir}/${asset_name}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "${apk}"
          (cd "${asset_dir}" && sha256sum "${asset_name}" > "${asset_name}.sha256")
          echo "apk=${apk}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${apk}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.asset.outputs.apk }}" \
            "${{ steps.asset.outputs.checksum }}" \
            --verify-tag \
            --title "Routempo Android v${{ steps.version.outputs.name }}" \
            --generate-notes
