openapi: 3.1.0
info:
  title: Routempo Mobile API
  version: 1.0.0
  description: Versioned contract implemented by Routempo for web sessions and first-party Android bearer sessions. Authenticated mutations accept an Idempotency-Key and replay the same result for identical retries for 24 hours.
servers:
  - url: https://routempo.netlify.app/api/v1
  - url: /api/v1
security:
  - bearerSession: []
  - cookieSession: []
tags:
  - { name: Auth }
  - { name: Settings }
  - { name: Categories }
  - { name: Routines }
  - { name: Occurrences }
  - { name: Logs }
  - { name: Analytics }
  - { name: Data }
  - { name: Integrations }
paths:
  /auth/google:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a Google Credential Manager ID token for a Routempo bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
                nonce: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/social/start:
    get:
      tags: [Auth]
      security: []
      summary: Start browser-based Google or Microsoft sign-in
      parameters:
        - {
            in: query,
            name: provider,
            required: true,
            schema: { type: string, enum: [google, microsoft] },
          }
        - {
            in: query,
            name: redirectUri,
            required: true,
            schema: { type: string },
          }
      responses:
        "302":
          {
            description: Redirect to the provider with protected OAuth state cookies,
          }
  /auth/social/callback:
    get:
      tags: [Auth]
      security: []
      summary: OAuth bridge callback; redirects to the registered Android URI with a one-time code
      parameters:
        - {
            in: query,
            name: redirectUri,
            required: true,
            schema: { type: string },
          }
      responses:
        "302": { description: Redirect to the Android app }
  /auth/social/exchange:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a five-minute, single-use social callback code for a bearer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code: { type: string }
                redirectUri: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      tags: [Auth]
      summary: Read the current user and settings
      parameters:
        - { $ref: "#/components/parameters/DeviceTimezone" }
      responses:
        "200":
          description: Current identity
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Envelope" }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
                          settings: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Extend the current bearer session by seven days
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        "200": { description: Session revoked }
  /settings:
    get:
      tags: [Settings]
      summary: Read profile, timezone, and reminder settings
      responses:
        "200": { description: Settings envelope }
    patch:
      tags: [Settings]
      summary: Partially update profile, timezone, and reminder settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsPatch" }
      responses:
        "200": { description: Updated settings envelope }
        "422": { $ref: "#/components/responses/Problem" }
  /categories:
    get:
      tags: [Categories]
      summary: List categories with routine usage counts
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Category list envelope }
    post:
      tags: [Categories]
      summary: Create a category; normalized duplicates return the existing category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "201": { description: Created category envelope }
  /categories/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceId" }
    patch:
      tags: [Categories]
      summary: Rename a category and propagate the name to routines and historical logs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryWrite" }
      responses:
        "200": { description: Updated category envelope }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Categories]
      summary: Delete an unused category
      responses:
        "200": { description: Category deleted }
        "409": { $ref: "#/components/responses/Problem" }
  /routines:
    get:
      tags: [Routines]
      summary: List routines sorted by scheduled time
      parameters:
        - {
            in: query,
            name: includeInactive,
            schema: { type: boolean, default: true },
          }
        - { in: query, name: categoryId, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Routine list envelope }
    post:
      tags: [Routines]
      summary: Create an active or paused routine
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineWrite" }
      responses:
        "201": { description: Created routine envelope }
        "422": { $ref: "#/components/responses/Problem" }
  /routines/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceId" }
    patch:
      tags: [Routines]
      summary: Partially edit, pause, or resume a routine
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutinePatch" }
      responses:
        "200": { description: Updated routine envelope }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Routines]
      summary: Delete a routine while preserving historical logs
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Routine deleted }
        "404": { $ref: "#/components/responses/Problem" }
  /occurrences:
    get:
      tags: [Occurrences]
      summary: Resolve routine definitions into dated occurrences
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/OccurrenceStatus" },
          }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Occurrence list envelope }
        "422": { $ref: "#/components/responses/Problem" }
  /occurrences/generate:
    post:
      tags: [Occurrences]
      summary: Resolve the current seven-day window and return its generated count
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Generation summary }
  /occurrences/{id}/complete:
    post:
      tags: [Occurrences]
      summary: Complete today's pending occurrence and create a behavior log
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccurrenceResolution" }
      responses:
        "200": { description: Resolved occurrence envelope }
        "409": { $ref: "#/components/responses/Problem" }
  /occurrences/{id}/skip:
    post:
      tags: [Occurrences]
      summary: Skip today's pending occurrence and create a behavior log
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccurrenceResolution" }
      responses:
        "200": { description: Resolved occurrence envelope }
        "409": { $ref: "#/components/responses/Problem" }
  /occurrences/{id}/revert:
    post:
      tags: [Occurrences]
      summary: Return an occurrence to pending and remove its app-created behavior log
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Pending occurrence envelope }
        "404": { $ref: "#/components/responses/Problem" }
  /logs:
    get:
      tags: [Logs]
      summary: List behavior logs with date, routine, category, and status filters
      parameters:
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
        - { in: query, name: routineId, schema: { type: string } }
        - { in: query, name: category, schema: { type: string } }
        - {
            in: query,
            name: status,
            schema: { $ref: "#/components/schemas/LogStatus" },
          }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Log list envelope }
    post:
      tags: [Logs]
      summary: Create a manual behavior log
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogWrite" }
      responses:
        "201": { description: Created log envelope }
  /logs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceId" }
    patch:
      tags: [Logs]
      summary: Correct selected fields on a behavior log
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogPatch" }
      responses:
        "200": { description: Updated log envelope }
    delete:
      tags: [Logs]
      summary: Delete a behavior log without changing its routine
      responses:
        "200": { description: Log deleted }
  /analytics:
    get:
      tags: [Analytics]
      summary: Return completion outcomes, daily series, and category breakdown
      parameters:
        - {
            in: query,
            name: range,
            schema: { type: integer, enum: [7, 30, 90], default: 7 },
          }
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
      responses:
        "200":
          description: Analytics envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsEnvelope" }
  /backup:
    get:
      tags: [Data]
      summary: Export a complete versioned Routempo JSON backup including occurrence history
      responses:
        "200": { description: Backup envelope }
    put:
      tags: [Data]
      summary: Replace the current user's settings, categories, routines, occurrences, and logs
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { type: object, description: routempo-data-export version 1 }
      responses:
        "200": { description: Backup restored }
        "422": { $ref: "#/components/responses/Problem" }
  /export:
    get:
      tags: [Data]
      summary: Download behavior logs as CSV
      parameters:
        - { in: query, name: startDate, schema: { type: string, format: date } }
        - { in: query, name: endDate, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv: { schema: { type: string } }
  /integrations:
    get:
      tags: [Integrations]
      summary: Return Google and Microsoft configuration and connection status
      responses:
        "200": { description: Provider status envelope }
    post:
      tags: [Integrations]
      summary: Import or export calendar/task resources using an already-linked provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, provider, resource]
              properties:
                action: { type: string, enum: [import, export] }
                provider: { type: string, enum: [google, microsoft] }
                resource: { type: string, enum: [calendar, tasks] }
      responses:
        "200": { description: Sync result envelope }
        "502": { $ref: "#/components/responses/Problem" }
  /integrations/{provider}/connect:
    post:
      tags: [Integrations]
      summary: Create a five-minute, single-use Custom Tab bootstrap URL for linking a provider
      parameters:
        - {
            in: path,
            name: provider,
            required: true,
            schema: { type: string, enum: [google, microsoft] },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirectUri]
              properties:
                redirectUri: { type: string }
      responses:
        "201": { description: Browser bootstrap URL envelope }
  /integrations/{provider}:
    delete:
      tags: [Integrations]
      summary: Disconnect a linked provider
      parameters:
        - {
            in: path,
            name: provider,
            required: true,
            schema: { type: string, enum: [google, microsoft] },
          }
      responses:
        "200": { description: Provider disconnected }
components:
  securitySchemes:
    bearerSession: { type: http, scheme: bearer }
    cookieSession: { type: apiKey, in: cookie, name: routempo.session_token }
  parameters:
    ResourceId: { in: path, name: id, required: true, schema: { type: string } }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Generate once per logical mutation and reuse only for an identical retry. Results are retained for 24 hours.
      schema: { type: string, minLength: 8, maxLength: 200 }
    DeviceTimezone:
      in: header
      name: X-Routempo-Timezone
      required: false
      description: Valid device IANA timezone used only to initialize an authenticated account whose saved timezone is still empty; it never overwrites an existing preference.
      schema: { type: string, example: Asia/Dhaka }
    Cursor:
      { in: query, name: cursor, schema: { type: string, pattern: "^[0-9]+$" } }
    Limit:
      {
        in: query,
        name: limit,
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
      }
  responses:
    AuthSession:
      description: Bearer session created or refreshed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthSessionEnvelope" }
    Problem:
      description: RFC 9457-style error response
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      required: [requestId, apiVersion, serverTime]
      properties:
        requestId: { type: string }
        apiVersion: { type: string, const: v1 }
        serverTime: { type: string, format: date-time }
        total: { type: integer }
        nextCursor: { type: string }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    User:
      type: object
      required: [id, name, email, image]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        image: { type: [string, "null"] }
    AuthSessionEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - type: object
          properties:
            data:
              type: object
              required: [session, user]
              properties:
                session:
                  type: object
                  required: [token, expiresAt]
                  properties:
                    token: { type: string }
                    expiresAt: { type: string, format: date-time }
                user: { $ref: "#/components/schemas/User" }
    AuthorizationUrlEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - type: object
          properties:
            data:
              type: object
              required: [authorizationUrl]
              properties:
                authorizationUrl: { type: string, format: uri }
    Settings:
      type: object
      required:
        [
          name,
          timezone,
          defaultReminderMinutes,
          routineRemindersEnabled,
          weeklySummaryEnabled,
        ]
      properties:
        name: { type: string }
        timezone: { type: string }
        defaultReminderMinutes:
          { type: integer, enum: [0, 5, 10, 15, 20, 30, 45, 60] }
        routineRemindersEnabled: { type: boolean }
        weeklySummaryEnabled: { type: boolean }
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string }
        defaultReminderMinutes:
          { type: integer, enum: [0, 5, 10, 15, 20, 30, 45, 60] }
        routineRemindersEnabled: { type: boolean }
        weeklySummaryEnabled: { type: boolean }
    CategoryWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    RoutineWrite:
      type: object
      required: [title, categoryId, startDate, scheduledTime, recurrenceType]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 160, default: "" }
        categoryId: { type: string }
        startDate: { type: string, format: date }
        scheduledTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        recurrenceType:
          { type: string, enum: [none, daily, weekly, monthly, yearly] }
        recurrenceRules:
          type: object
          properties:
            daysOfWeek:
              {
                type: array,
                minItems: 1,
                maxItems: 7,
                uniqueItems: true,
                items: { type: integer, minimum: 0, maximum: 6 },
              }
            dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
            month: { type: integer, minimum: 1, maximum: 12 }
        endDate: { type: [string, "null"], format: date }
        isActive: { type: boolean, default: true }
    RoutinePatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 160 }
        categoryId: { type: string }
        startDate: { type: string, format: date }
        scheduledTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        recurrenceType:
          { type: string, enum: [none, daily, weekly, monthly, yearly] }
        recurrenceRules:
          type: object
          properties:
            daysOfWeek:
              {
                type: array,
                minItems: 1,
                maxItems: 7,
                uniqueItems: true,
                items: { type: integer, minimum: 0, maximum: 6 },
              }
            dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
            month: { type: integer, minimum: 1, maximum: 12 }
        endDate: { type: [string, "null"], format: date }
        isActive: { type: boolean }
    OccurrenceStatus:
      { type: string, enum: [pending, completed, skipped, missed] }
    OccurrenceResolution:
      type: object
      properties:
        actualTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        note: { type: string, maxLength: 240 }
    LogStatus: { type: string, enum: [completed, skipped, missed] }
    LogWrite:
      type: object
      required: [date, eventTime, title, category, scheduledTime, status]
      properties:
        routineId: { type: [string, "null"] }
        date: { type: string, format: date }
        eventTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        title: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, minLength: 1, maxLength: 60 }
        scheduledTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        actualTime: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/LogStatus" }
        note: { type: string, maxLength: 240 }
    LogPatch:
      type: object
      minProperties: 1
      properties:
        routineId: { type: [string, "null"] }
        date: { type: string, format: date }
        eventTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        title: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, minLength: 1, maxLength: 60 }
        scheduledTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        actualTime: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/LogStatus" }
        note: { type: string, maxLength: 240 }
    OutcomeSummary:
      type: object
      required:
        [completed, skipped, missed, unrecorded, total, completionPercentage]
      properties:
        completed: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        missed: { type: integer, minimum: 0 }
        unrecorded:
          {
            type: integer,
            minimum: 0,
            description: Scheduled occurrences without a recorded outcome,
          }
        total:
          {
            type: integer,
            minimum: 0,
            description: Greater of scheduled occurrences and recorded outcomes,
          }
        completionPercentage: { type: integer, minimum: 0, maximum: 100 }
    Analytics:
      type: object
      required:
        [
          startDate,
          endDate,
          completionPercentage,
          outcomes,
          series,
          categories,
          generatedAt,
        ]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        completionPercentage: { type: integer, minimum: 0, maximum: 100 }
        outcomes: { $ref: "#/components/schemas/OutcomeSummary" }
        series:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/OutcomeSummary" }
              - type: object
                required: [date]
                properties:
                  date: { type: string, format: date }
        categories:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/OutcomeSummary" }
              - type: object
                required: [category, routineCount]
                properties:
                  category: { type: string }
                  routineCount: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
    AnalyticsEnvelope:
      allOf:
        - { $ref: "#/components/schemas/Envelope" }
        - type: object
          properties:
            data:
              type: object
              required: [analytics]
              properties:
                analytics: { $ref: "#/components/schemas/Analytics" }
